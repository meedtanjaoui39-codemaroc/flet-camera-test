name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.86.0"
          pip install flet-camera

      - name: Build APK
        run: |
          flet build apk --yes \
            --android-permissions android.permission.CAMERA=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camera-test-apk
          path: build/apk/*.apk
